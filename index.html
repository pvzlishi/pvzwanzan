<script>
const ASSET={
 president:"https://github.com/pvzlishi/pvztuku/raw/refs/heads/main/以色列总统豌豆射手.jpg",
 pea:"https://github.com/pvzlishi/pvztuku/raw/refs/heads/main/以色列豌豆.jpg",
 sun:"https://github.com/pvzlishi/pvztuku/raw/refs/heads/main/阳光.jpg",
 general:"https://github.com/pvzlishi/pvztuku/raw/refs/heads/main/阳光将.jpg"
};
const $=id=>document.getElementById(id);
let selected="president",sun=150,plants=[],zombies=[],peas=[],sunDrops=[];
let devMode=false,running=false,ended=false,wave=0,spawn=0,last=0,skyTimer=0;
const R=5,C=9;
function setImage(id,url,emoji){
 const im=$(id);im.src=url;
 im.onerror=()=>{im.onerror=null;im.style.display="none";im.insertAdjacentText("afterend",emoji)};
}
setImage("sunIcon",ASSET.sun,"☀️");
setImage("presidentIcon",ASSET.president,"🫛");
setImage("generalIcon",ASSET.general,"🌻");

function toast(t){
 const e=$("toast");e.textContent=t;e.classList.remove("hidden");
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>e.classList.add("hidden"),1800);
}
function updateSun(){$("sun").textContent=sun}
function cell(r,c){return $("board").children[r*C+c]}
function buildBoard(){
 $("board").innerHTML="";
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
  let e=document.createElement("div");
  e.className="cell";
  e.onclick=ev=>{
   const drop=ev.target.closest(".sun-drop");
   if(drop){collectSun(drop.dataset.id);return}
   plantAt(r,c);
  };
  $("board").appendChild(e);
 }
}
function startGame(dev){
 devMode=dev;
 $("home").classList.add("hidden");
 $("game").classList.remove("hidden");
 $("dev").classList.toggle("hidden",!dev);
 resetGame(false);
 toast(dev?"开发者模式已开启":"冒险测试关卡已开启");
}
function goHome(){
 running=false;
 $("game").classList.add("hidden");
 $("home").classList.remove("hidden");
 $("dialog").classList.add("hidden");
}
document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{
 selected=b.dataset.type;
 document.querySelectorAll("[data-type]").forEach(x=>x.classList.toggle("selected",x===b));
 toast(selected==="president"?"已选择豌豆射手":"已选择向日葵");
});
function plantAt(r,c){
 if(ended)return;
 let old=plants.find(p=>p.r===r&&p.c===c);
 if(old){
  if(sun<75)return toast("升级需要75阳光");
  sun-=75;
  old.level=Math.min(3,old.level+1);
  old.hp+=50;
  updateSun();renderPlants();
  return toast("植物升级成功！");
 }
 let cost=selected==="president"?100:50;
 if(sun<cost)return toast("阳光不足！");
 sun-=cost;
 plants.push({r,c,type:selected,level:1,hp:100,shot:0,sunTimer:0});
 updateSun();renderPlants();
}
function renderPlants(){
 document.querySelectorAll(".cell").forEach(e=>{
  e.querySelectorAll("img,.emoji,.plant-level").forEach(n=>n.remove());
 });
 for(const p of plants){
  let e=cell(p.r,p.c),im=document.createElement("img");
  im.src=p.type==="president"?ASSET.president:ASSET.general;
  im.alt=p.type==="president"?"豌豆射手":"向日葵";
  im.onerror=()=>{
   im.remove();
   let em=document.createElement("span");
   em.className="emoji";
   em.textContent=p.type==="president"?"🫛":"🌻";
   e.appendChild(em);
  };
  e.appendChild(im);
  if(p.level>1){
   let b=document.createElement("b");
   b.className="plant-level";
   b.textContent="+"+(p.level-1);
   b.style.cssText="position:absolute;right:0;top:0;background:#ffe35a;z-index:4";
   e.appendChild(b);
  }
 }
 renderZombies();renderSunDrops();
}
function addZombie(boss=false){
 zombies.push({
  r:Math.floor(Math.random()*R),
  x:$("board").clientWidth+10,
  hp:boss?600:100,
  speed:boss?8:13,
  boss,attack:0
 });
 renderZombies();updateCount();
}
function renderZombies(){
 document.querySelectorAll(".zombie").forEach(e=>e.remove());
 for(const z of zombies){
  let col=Math.max(0,Math.min(C-1,Math.floor(z.x/($("board").clientWidth/C))));
  let e=cell(z.r,col),d=document.createElement("div");
  d.className="zombie";
  d.textContent=z.boss?"👑🧟":"🧟";
  d.title=z.boss?"历史 Boss":"普通僵尸";
  e.appendChild(d);
 }
}
function updateCount(){$("count").textContent="僵尸："+zombies.length}
function addSun(n){sun+=n;updateSun();toast("阳光 +"+n)}
function clearZombies(){zombies=[];peas=[];renderZombies();updateCount();toast("僵尸已清除")}
function toggleWave(){
 if(ended)return;
 running=!running;
 if(running){wave++;spawn=0;toast("第 "+wave+" 波僵尸来袭！")}
 else toast("僵尸暂停");
 $("status").textContent="冒险测试关卡 "+Math.max(1,wave)+(running?" · 僵尸来袭":" · 暂停");
}
function skill(){
 if(sun<100)return toast("技能需要100阳光");
 sun-=100;
 zombies.forEach(z=>z.hp-=160);
 updateSun();toast("整活技能发动！");
}
function fire(p){
 peas.push({
  r:p.r,
  x:(p.c+.8)*$("board").clientWidth/C,
  y:(p.r+.5)*$("board").clientHeight/R,
  damage:25*p.level
 });
}
function dropSun(r,c){
 const id=Math.random().toString(36).slice(2);
 sunDrops.push({
  id,r,c,
  x:(c+.5)*$("board").clientWidth/C,
  y:(r+.5)*$("board").clientHeight/R,
  life:9
 });
 renderSunDrops();
}
function renderSunDrops(){
 document.querySelectorAll(".sun-drop").forEach(e=>e.remove());
 for(const s of sunDrops){
  let col=Math.max(0,Math.min(C-1,Math.floor(s.x/($("board").clientWidth/C))));
  let e=cell(s.r,col),b=document.createElement("button");
  b.className="sun-drop";
  b.dataset.id=s.id;
  b.style.cssText="position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;box-shadow:none;width:34px;height:34px";
  let im=document.createElement("img");
  im.src=ASSET.sun;
  im.alt="收集阳光";
  im.style.cssText="width:100%;height:100%;object-fit:contain";
  im.onerror=()=>{im.remove();b.textContent="☀️";b.style.fontSize="27px"};
  b.appendChild(im);
  b.onclick=ev=>{ev.stopPropagation();collectSun(s.id)};
  e.appendChild(b);
 }
}
function collectSun(id){
 const i=sunDrops.findIndex(s=>s.id===id);
 if(i<0)return;
 sunDrops.splice(i,1);
 sun+=25;updateSun();renderSunDrops();
 toast("+25 阳光");
}
function renderPeas(dt){
 document.querySelectorAll(".pea").forEach(e=>e.remove());
 for(const p of peas){
  p.x+=300*dt;
  for(const z of zombies){
   if(!p.hit&&z.r===p.r&&p.x>=z.x-10&&p.x<=z.x+35){
    z.hp-=p.damage;p.hit=true;
   }
  }
  if(!p.hit){
   let e=document.createElement("div");
   e.className="pea";
   e.style.left=p.x+"px";e.style.top=p.y+"px";
   let im=document.createElement("img");
   im.src=ASSET.pea;
   im.alt="以色列豌豆";
   im.style.cssText="width:100%;height:100%;object-fit:contain";
   im.onerror=()=>{im.remove();e.style.background="#68ff35"};
   e.style.background="transparent";
   e.appendChild(im);
   $("board").appendChild(e);
  }
 }
 peas=peas.filter(p=>p.x<$("board").clientWidth+20&&!p.hit);
}
function endGame(win){
 ended=true;running=false;
 $("dialogTitle").textContent=win?"测试胜利！":"僵尸突破防线！";
 $("dialogText").textContent=win?"你守住了草坪！":"本局结束，再试一次吧。";
 $("dialog").classList.remove("hidden");
}
function tick(now){
 let dt=Math.min(.05,(now-last)/1000||0);
 last=now;
 if(!$("game").classList.contains("hidden")&&!ended){
  // 天空随机掉落阳光，无需种植向日葵
  skyTimer+=dt;
  if(skyTimer>5+Math.random()*3){
   dropSun(Math.floor(Math.random()*R),Math.floor(Math.random()*C));
   skyTimer=0;
  }
  for(const s of sunDrops)s.life-=dt;
  sunDrops=sunDrops.filter(s=>s.life>0);
  renderSunDrops();

  if(running){
   spawn+=dt;
   if(spawn>4&&zombies.length<Math.min(12,4+wave)){
    addZombie();spawn=0;
   }
   const cw=$("board").clientWidth/C;
   for(const z of zombies){
    let col=Math.floor(z.x/cw);
    let p=plants.find(p=>p.r===z.r&&p.c===col);
    if(p){
     z.attack+=dt;
     if(z.attack>1){
      p.hp-=z.boss?20:10;z.attack=0;
      if(p.hp<=0){plants=plants.filter(x=>x!==p);renderPlants()}
     }
    }else z.x-=z.speed*dt;
   }
   for(const p of plants){
    if(p.type==="president"){
     p.shot+=dt;
     if(zombies.some(z=>z.r===p.r&&z.x>p.c*cw)&&p.shot>Math.max(.45,1.2-.2*(p.level-1))){
      fire(p);p.shot=0;
     }
    }else{
     p.sunTimer+=dt;
     if(p.sunTimer>7){
      dropSun(p.r,p.c);
      p.sunTimer=0;
      toast("向日葵生产了阳光！");
     }
    }
   }
   zombies=zombies.filter(z=>{
    if(z.hp<=0){sun+=z.boss?100:25;updateSun();return false}
    if(z.x<0){endGame(false);return false}
    return true;
   });
   renderPeas(dt);renderZombies();updateCount();
  }
 }
 requestAnimationFrame(tick);
}
function saveGame(){
 try{
  localStorage.setItem("historyPVZ",JSON.stringify({sun,wave,plants}));
  toast("进度已保存");
 }catch(e){toast("无法保存进度")}
}
function loadGame(){
 try{
  let d=JSON.parse(localStorage.getItem("historyPVZ"));
  if(d){sun=d.sun||150;wave=d.wave||0;plants=d.plants||[];updateSun();renderPlants()}
 }catch(e){}
}
function resetGame(show=true){
 sun=150;plants=[];zombies=[];peas=[];sunDrops=[];
 wave=0;spawn=0;skyTimer=0;running=false;ended=false;
 $("dialog").classList.add("hidden");
 buildBoard();updateSun();updateCount();
 $("status").textContent=devMode?"开发者模式":"冒险测试关卡 1";
 if(show)toast("本局已重置");
}
$("devSun").onclick=()=>addSun(500);
$("devZombie").onclick=()=>addZombie(false);
$("devBoss").onclick=()=>addZombie(true);
$("devClear").onclick=clearZombies;
$("devSave").onclick=saveGame;
$("devReset").onclick=()=>resetGame();
$("skillBtn").onclick=skill;
buildBoard();updateSun();last=performance.now();requestAnimationFrame(tick);
</script>
</body>
</html>
